name: Windows desktop preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create portable preview bundle
        shell: pwsh
        run: ./scripts/package_windows_preview.ps1
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: Recall-Desktop-Preview
          path: dist/Recall-Desktop-Preview.zip
