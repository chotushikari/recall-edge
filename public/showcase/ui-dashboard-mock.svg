<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">Illustrative Recall workspace UI</title><desc id="desc">A warm dashboard mock showing a timeline, an ask field and local privacy status.</desc><defs><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#19172d" flood-opacity=".16"/></filter></defs><rect width="1600" height="980" fill="#f4efe9"/><text x="104" y="94" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#e76f51" letter-spacing="3">ILLUSTRATIVE UI MOCK · NOT A LIVE SCREENSHOT</text><g transform="translate(104 138)" filter="url(#s)" font-family="Inter,Arial,sans-serif"><rect width="1392" height="744" rx="28" fill="#fcfaf7"/><rect width="238" height="744" rx="28" fill="#25233d"/><text x="35" y="58" font-size="28" font-weight="700" fill="white">Recall</text><text x="35" y="92" font-size="14" fill="#f5b08d" letter-spacing="2">YOUR LOCAL MEMORY</text><g font-size="17" fill="#ddd9e6"><text x="35" y="172">◉  Today</text><text x="35" y="220">⌕  Search</text><text x="35" y="268">◫  Timeline</text><text x="35" y="316">⚙  Privacy</text></g><rect x="24" y="638" width="190" height="72" rx="18" fill="#373454"/><circle cx="51" cy="674" r="8" fill="#89c5aa"/><text x="70" y="669" font-size="15" fill="white">CAPTURE ON</text><text x="70" y="692" font-size="13" fill="#c7c3d5">Pause anytime</text><text x="282" y="65" font-size="18" fill="#69657a">Thursday · Activity memory</text><text x="282" y="112" font-family="Georgia,serif" font-size="42" fill="#1c1a2c">Find your way back.</text><rect x="282" y="150" width="1068" height="62" rx="18" fill="#f0ece6"/><text x="310" y="189" font-size="18" fill="#777183">Ask your computer about a moment, project, or page…</text><circle cx="1313" cy="181" r="20" fill="#e76f51"/><text x="1306" y="188" font-size="18" fill="white">→</text><text x="282" y="264" font-size="15" font-weight="700" fill="#e76f51" letter-spacing="2">TIMELINE · TODAY</text><g><path d="M314 312v350" stroke="#d9d3cc" stroke-width="3"/><circle cx="314" cy="342" r="10" fill="#e76f51"/><circle cx="314" cy="476" r="10" fill="#6972c9"/><circle cx="314" cy="610" r="10" fill="#89a98f"/><text x="282" y="347" font-size="15" fill="#777183">10:42</text><text x="282" y="481" font-size="15" fill="#777183">11:08</text><text x="282" y="615" font-size="15" fill="#777183">11:36</text></g><g><rect x="370" y="302" width="610" height="96" rx="20" fill="#fff3e9"/><text x="398" y="337" font-size="18" font-weight="700" fill="#25233d">Research session · browser</text><text x="398" y="369" font-size="16" fill="#777183">Documentation, repository notes, and a Qdrant search.</text><rect x="370" y="436" width="610" height="96" rx="20" fill="#f0effb"/><text x="398" y="471" font-size="18" font-weight="700" fill="#25233d">Implementation · editor</text><text x="398" y="503" font-size="16" fill="#777183">Updated a sync path and reviewed the test output.</text><rect x="370" y="570" width="610" height="96" rx="20" fill="#eff7f0"/><text x="398" y="605" font-size="18" font-weight="700" fill="#25233d">Evidence review · browser</text><text x="398" y="637" font-size="16" fill="#777183">Returned to the relevant documentation and project context.</text></g><rect x="1022" y="264" width="328" height="406" rx="24" fill="#25233d"/><text x="1052" y="306" font-size="15" fill="#f5b08d" letter-spacing="2">MEMORY GUIDE</text><circle cx="1079" cy="365" r="25" fill="#f5b08d"/><circle cx="1069" cy="365" r="3" fill="#25233d"/><circle cx="1079" cy="365" r="3" fill="#25233d"/><circle cx="1089" cy="365" r="3" fill="#25233d"/><text x="1052" y="422" font-size="23" font-weight="700" fill="white">Ask about your day.</text><text x="1052" y="456" font-size="16" fill="#d5d1df">Start with a time, app,</text><text x="1052" y="480" font-size="16" fill="#d5d1df">site, or project name.</text><rect x="1052" y="528" width="266" height="48" rx="14" fill="#373454"/><text x="1070" y="558" font-size="15" fill="#f2eff8">What happened this morning?</text><text x="1052" y="633" font-size="13" fill="#aaa6bc">Local-first · evidence-linked</text></g></svg>
