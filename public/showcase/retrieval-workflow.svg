<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Recall retrieval workflow</title><desc id="desc">A question is interpreted using time and context, retrieves exact and semantic evidence, expands to sessions, ranks results, then provides a grounded answer.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6z" fill="#6d6881"/></marker></defs><rect width="1600" height="760" fill="#fffaf6"/><text x="96" y="100" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#e76f51" letter-spacing="3">RETRIEVAL WORKFLOW</text><text x="96" y="154" font-family="Georgia,serif" font-size="52" fill="#171527">Search the past; show the proof.</text><g font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle"><g fill="#202039"><rect x="96" y="290" width="190" height="120" rx="24"/><rect x="1314" y="290" width="190" height="120" rx="24"/></g><g fill="white"><rect x="340" y="290" width="190" height="120" rx="24"/><rect x="584" y="290" width="190" height="120" rx="24"/><rect x="828" y="290" width="190" height="120" rx="24"/><rect x="1072" y="290" width="190" height="120" rx="24"/></g><g stroke="#6d6881" stroke-width="3" marker-end="url(#a)"><path d="M290 350h42"/><path d="M534 350h42"/><path d="M778 350h42"/><path d="M1022 350h42"/><path d="M1266 350h42"/></g><g font-weight="700"><text x="191" y="338" fill="white">Question</text><text x="435" y="332" fill="#171527">Interpret</text><text x="679" y="332" fill="#171527">Retrieve</text><text x="923" y="332" fill="#171527">Expand</text><text x="1167" y="332" fill="#171527">Rank</text><text x="1409" y="338" fill="white">Answer</text></g><g font-size="16"><text x="191" y="370" fill="#d7d5e4">“What did I do</text><text x="191" y="392" fill="#d7d5e4">after VS Code?”</text><text x="435" y="364" fill="#68647a">Time range</text><text x="435" y="388" fill="#68647a">app · intent</text><text x="679" y="364" fill="#68647a">Events · FTS</text><text x="679" y="388" fill="#68647a">semantic index</text><text x="923" y="364" fill="#68647a">Nearby events</text><text x="923" y="388" fill="#68647a">activity session</text><text x="1167" y="364" fill="#68647a">Recency · match</text><text x="1167" y="388" fill="#68647a">privacy policy</text><text x="1409" y="370" fill="#d7d5e4">Citations to</text><text x="1409" y="392" fill="#d7d5e4">source evidence</text></g></g><g font-family="Inter,Arial,sans-serif"><rect x="96" y="514" width="1408" height="104" rx="25" fill="#f3edf9"/><text x="132" y="556" font-size="19" font-weight="700" fill="#6972c9">WHY THIS IS NOT JUST A CHATBOT</text><text x="132" y="590" font-size="22" fill="#39354d">The answer is a reconstruction of recorded activity. The evidence panel is the product; AI interpretation comes after retrieval.</text></g><text x="96" y="685" font-family="Inter,Arial,sans-serif" font-size="17" fill="#68647a">Current foundation: local timeline, exact search, semantic memory index, evidence detail. OCR and fully grounded AI synthesis remain explicit roadmap work.</text></svg>
