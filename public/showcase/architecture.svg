<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Recall architecture</title><desc id="desc">Computer context flows through capture, local memory, enrichment, retrieval, and an Ask My Computer experience.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#f1f0ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#171527" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6z" fill="#88839c"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="96" y="102" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#e76f51" letter-spacing="3">RECALL · SYSTEM MAP</text><text x="96" y="154" font-family="Georgia,serif" font-size="52" fill="#171527">From permitted activity to grounded recall.</text><text x="96" y="195" font-family="Inter,Arial,sans-serif" font-size="22" fill="#68647a">Every answer stays connected to the events and frames that support it.</text>
<g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
<g transform="translate(96 292)"><rect width="250" height="210" rx="28" fill="#202039"/><text x="28" y="48" font-size="20" fill="#f5b08d">01 · OBSERVE</text><text x="28" y="92" font-size="30" fill="white" font-weight="700">Computer context</text><text x="28" y="132" font-size="19" fill="#d7d5e4">▣ Screen frames</text><text x="28" y="164" font-size="19" fill="#d7d5e4">◉ Apps &amp; windows</text><text x="28" y="196" font-size="19" fill="#d7d5e4">⌁ Browser context</text></g>
<g transform="translate(410 292)"><rect width="250" height="210" rx="28" fill="white"/><text x="28" y="48" font-size="20" fill="#e76f51">02 · CAPTURE</text><text x="28" y="92" font-size="30" fill="#171527" font-weight="700">Privacy gate</text><text x="28" y="132" font-size="19" fill="#68647a">Pause &amp; stop</text><text x="28" y="164" font-size="19" fill="#68647a">App / window exclusions</text><text x="28" y="196" font-size="19" fill="#68647a">Visible status</text></g>
<g transform="translate(724 292)"><rect width="250" height="210" rx="28" fill="#fff3e9"/><text x="28" y="48" font-size="20" fill="#e76f51">03 · REMEMBER</text><text x="28" y="92" font-size="30" fill="#171527" font-weight="700">Local evidence</text><text x="28" y="132" font-size="19" fill="#68647a">SQLite event store</text><text x="28" y="164" font-size="19" fill="#68647a">Frames &amp; metadata</text><text x="28" y="196" font-size="19" fill="#68647a">Sessions &amp; history</text></g>
<g transform="translate(1038 292)"><rect width="250" height="210" rx="28" fill="white"/><text x="28" y="48" font-size="20" fill="#6972c9">04 · UNDERSTAND</text><text x="28" y="92" font-size="30" fill="#171527" font-weight="700">Enrich &amp; index</text><text x="28" y="132" font-size="19" fill="#68647a">OCR · planned</text><text x="28" y="164" font-size="19" fill="#68647a">FTS &amp; vectors</text><text x="28" y="196" font-size="19" fill="#68647a">Topics &amp; summaries</text></g></g>
<g stroke="#88839c" stroke-width="3" marker-end="url(#arrow)"><path d="M350 397h52"/><path d="M664 397h52"/><path d="M978 397h52"/><path d="M1163 512v94"/></g>
<g transform="translate(724 620)" filter="url(#shadow)" font-family="Inter,Arial,sans-serif"><rect width="564" height="172" rx="28" fill="#312e55"/><circle cx="63" cy="86" r="32" fill="#f5b08d"/><circle cx="51" cy="84" r="5" fill="#312e55"/><circle cx="64" cy="84" r="5" fill="#312e55"/><circle cx="77" cy="84" r="5" fill="#312e55"/><text x="122" y="67" font-size="19" fill="#f5b08d" letter-spacing="2">05 · RETRIEVE &amp; RECONSTRUCT</text><text x="122" y="111" font-size="31" font-weight="700" fill="white">Ask My Computer</text><text x="122" y="143" font-size="19" fill="#d7d5e4">Time + text + semantic evidence → cited answer</text></g>
<text x="96" y="845" font-family="Inter,Arial,sans-serif" font-size="18" fill="#68647a">Solid stages are present in the current foundation. Planned capabilities are deliberately labeled as roadmap items.</text></svg>
