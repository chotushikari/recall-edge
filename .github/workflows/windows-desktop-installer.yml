name: Windows desktop preview

on:
  workflow_dispatch:

jobs:
  package-preview:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assemble source preview
        shell: pwsh
        run: ./scripts/package_windows_preview.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Recall-Desktop-Preview
          path: dist/Recall-Desktop-Preview.zip

# A release job must only be added after a desktop shell is selected and the
# project owner configures protected certificate secrets. See docs/windows-installer.md.
