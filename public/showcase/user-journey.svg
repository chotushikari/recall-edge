<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">Recall user journey</title><desc id="desc">A user opts in, works normally, asks a question, inspects evidence, and controls retention.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#202039"/><stop offset="1" stop-color="#39355f"/></linearGradient></defs><rect width="1600" height="760" fill="url(#bg)"/><text x="96" y="100" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="20" fill="#f5b08d" letter-spacing="3">USER JOURNEY</text><text x="96" y="154" font-family="Georgia,serif" font-size="52" fill="white">Memory with consent at every step.</text><g font-family="Inter,Arial,sans-serif"><path d="M222 400H1378" stroke="#88839c" stroke-width="4"/><g fill="#f5b08d"><circle cx="226" cy="400" r="18"/><circle cx="514" cy="400" r="18"/><circle cx="803" cy="400" r="18"/><circle cx="1091" cy="400" r="18"/><circle cx="1380" cy="400" r="18"/></g><g font-size="22" fill="white" font-weight="700"><text x="156" y="290">1. Choose</text><text x="438" y="290">2. Work</text><text x="718" y="290">3. Ask</text><text x="1001" y="290">4. Verify</text><text x="1292" y="290">5. Control</text></g><g font-size="18" fill="#d7d5e4"><text x="112" y="335">Turn capture on.</text><text x="112" y="361">Set exclusions.</text><text x="392" y="335">Apps, windows,</text><text x="392" y="361">permitted screens.</text><text x="681" y="335">“What did I do</text><text x="681" y="361">after VS Code?”</text><text x="961" y="335">Open the exact</text><text x="961" y="361">events &amp; frames.</text><text x="1255" y="335">Pause, prune,</text><text x="1255" y="361">export or wipe.</text></g><g font-size="16" fill="#aaa6bc"><text x="151" y="466">Explicit opt-in</text><text x="448" y="466">No behavior change</text><text x="742" y="466">Natural language</text><text x="1003" y="466">Grounded evidence</text><text x="1280" y="466">User remains owner</text></g></g><rect x="96" y="568" width="1408" height="100" rx="24" fill="#ffffff12" stroke="#ffffff22"/><text x="130" y="610" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="20" fill="#f5b08d">Principle</text><text x="130" y="642" font-family="Inter,Arial,sans-serif" font-size="22" fill="white">Recall is useful only when memory is inspectable, interruptible, and removable by the person whose computer it is.</text></svg>
