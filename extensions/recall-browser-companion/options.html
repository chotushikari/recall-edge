<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Recall Edge Companion</title><style>body{font:14px system-ui;margin:32px;max-width:560px;color:#18181b}label{display:block;margin:18px 0 6px}input{width:100%;padding:9px;box-sizing:border-box}button{margin-top:20px;padding:9px 14px}small{color:#52525b;line-height:1.5;display:block}</style></head><body><h1>Recall Edge Browser Companion</h1><p>This extension writes sanitized tab activity only to your local Recall API.</p><label><input id="enabled" type="checkbox"> Capture browser activity</label><label for="api-base">Local Recall API</label><input id="api-base" type="url" value="http://127.0.0.1:8000"><small>URLs are stored without query strings, fragments, or credentials. Incognito tabs are never recorded. Recall Edge does not sync raw browser activity to Qdrant Cloud.</small><button id="save">Save</button><span id="status"></span><script src="options.js"></script></body></html>
